apiVersion: apps/v1
kind: Deployment
metadata:
  name: chumon-hub
spec:
  replicas: 1
  # 単一ノードの Pod 予算は Allocatable 874Mi。既定の RollingUpdate は
  # replicas:1 でも maxSurge を 1 に切り上げるため、更新中に 2 Pod が並び
  # memory limit の合計が 1024Mi となって予算を超える。surge を禁止し、
  # 旧 Pod を停止してから新 Pod を起動する。
  # 代償として、デプロイのたびに数十秒のサービス断が出る。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # ロールアウトが進まない場合に失敗として確定させる
  # (deploy.yml の rollout status は 180s で打ち切るため、それより後ろに置く)
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: chumon-hub
  template:
    metadata:
      labels:
        app: chumon-hub
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chumon-hub
          # 重要: ユーザー名はすべて小文字にする
          image: ghcr.io/fumiakic/chumon-hub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

          # ★★★ 追加: リソース制限設定 ★★★
          resources:
            # Requests: Pod起動時に最低限確保されるリソース（予約分）
            requests:
              cpu: '100m' # 0.1 コア
              memory: '256Mi' # 256 メガバイト
            # Limits: Podが使用できる最大リソース（上限）
            limits:
              cpu: '1000m' # 1 コア(これを超えるとPodが制限される)
              # ノード容量 1906Mi から k3s / OS の予約と eviction しきい値を引いた
              # Allocatable(約 874Mi) に、他 Pod の分を残して収まる値にする。
              # 詳細と算出根拠: docs/ops/k3s-node-config.md
              memory: '512Mi'

          # --- ヘルスチェック ---
          # 応答先は /healthz（認証不要・依存なしの最小エンドポイント）。
          # 重い同期処理でイベントループが塞がると /healthz も応答しないため、
          # liveness は「デッドロックの検知」に限定して寛容に設定し、
          # 負荷時の誤再起動で処理中のリクエストを巻き添えにしないようにする。

          # 1. Startup Probe (起動確認: 成功するまで liveness/readiness を動かさない)
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24 # 最大 120 秒まで起動を待つ

          # 2. Liveness Probe (生存確認: 失敗すると再起動)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5 # 約 150 秒応答しなければ再起動

          # 3. Readiness Probe (準備確認: 失敗すると通信を流さない)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3 # replicas:1 のため readiness 失敗＝全断。安易に落とさない

          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chumon-hub-secret
                  key: GOOGLE_API_KEY

            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: chumon-hub-secret
                  key: API_SECRET

            - name: CLOUDFLARE_TEAM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: chumon-hub-secret
                  key: CLOUDFLARE_TEAM_DOMAIN

            - name: CLOUDFLARE_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: chumon-hub-secret
                  key: CLOUDFLARE_AUDIENCE
