name: CI Check

on:
  pull_request:
    branches: ['main']

# GITHUB_TOKEN の権限はリポジトリ設定の既定値に依存させず、ここで全権限なしにする。
# 各ジョブは checkout に必要な contents: read だけをジョブ単位で付与する。
permissions: {}

jobs:
  build-check:
    # ubuntu-latest による OS 世代の自動切り替えを避けるため版を明示する（同じ版のイメージは週次で更新される）。
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_TEAM_DOMAIN: chumon-ci
      CLOUDFLARE_AUDIENCE: chumon-ci-smoke
      CROP_SMOKE_SUBDIR: chumon-crop-smoke
      CROP_SMOKE_NETWORK: chumon-crop-smoke
      CROP_SMOKE_CLAIM_MARKER: claims-leak-marker@smoke.invalid
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ビルドのみ行い、Pushはしない.
      # load: true でビルド結果をローカル docker に取り込み、後続のスモークで起動する.
      - name: Build check
        uses: docker/build-push-action@v7
        # build record（ビルドの入力・出力・統計・ログ）は artifact に保存しない. ジョブサマリは残す.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          load: true
          tags: chumon-hub:ci
          cache-from: type=gha

          cache-to: type=gha,mode=max

      - name: Check raster dependencies in production image
        run: |
          docker run --rm -i --entrypoint node chumon-hub:ci <<'NODE'
          const assert = require('node:assert/strict')
          const { statSync } = require('node:fs')
          const path = require('node:path')
          const { createCanvas } = require('@napi-rs/canvas')

          async function check() {
            const canvas = createCanvas(2, 2)
            canvas.getContext('2d').fillRect(0, 0, 2, 2)
            const png = await canvas.encode('png')
            assert(png.length > 8)
            assert.equal(png.subarray(0, 8).toString('hex'), '89504e470d0a1a0a')

            // 素の Node の require.resolve はバンドラの書き換えを受けないため、
            // アプリと同じ cwd 基点で確認し、解決基点のずれを見逃さない。
            const pdfjsRoot = path.join(process.cwd(), 'node_modules', 'pdfjs-dist')
            const files = {
              standard_fonts: ['LiberationSans-Regular.ttf', 'FoxitDingbats.pfb'],
              wasm: ['jbig2.wasm', 'openjpeg.wasm', 'qcms_bg.wasm'],
              cmaps: ['UniJIS-UCS2-H.bcmap'],
              iccs: ['CGATS001Compat-v2-micro.icc'],
            }
            for (const [directory, names] of Object.entries(files)) {
              for (const name of names) {
                assert(statSync(path.join(pdfjsRoot, directory, name)).isFile())
              }
            }
            console.log('Raster dependencies OK: canvas PNG and all four pdfjs data directories')
          }
          check().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      # 素の node のラスタ依存チェックは、Turbopack バンドル経由のクロップ経路
      # （proxy.ts → 認証 → /api/crop-title-block → ラスタクロップ）を通らない.
      # #346 ではバンドル経由のときだけ壊れたため、本番イメージの HTTP 経路も検査する.
      # 本番コードに認証バイパスを入れず、偽の Access IdP と使い捨て CA を使い、
      # 本番と同じ JWT 検証を通す.
      # NODE_TLS_REJECT_UNAUTHORIZED=0 などで TLS 検証を無効化しない.
      # 信頼の追加は NODE_EXTRA_CA_CERTS による使い捨て CA だけとする.
      # GitHub secrets は使わず、Dependabot の PR でも実行する.
      # Cloudflare Access を撤去する ADR-3 の ③ では、この認証部分を作り直す必要がある.
      - name: Prepare crop smoke materials
        timeout-minutes: 3
        run: |
          work_dir="$RUNNER_TEMP/$CROP_SMOKE_SUBDIR"
          idp_host="$CLOUDFLARE_TEAM_DOMAIN.cloudflareaccess.com"
          mkdir -p "$work_dir/tls" "$work_dir/jwt"
          chmod 755 "$work_dir" "$work_dir/tls" "$work_dir/jwt"
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=Disposable CI Access CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$work_dir/tls/ca.key" -out "$work_dir/tls/ca.crt"
          openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -subj "/CN=$idp_host" \
            -keyout "$work_dir/tls/server.key" -out "$work_dir/tls/server.csr"
          printf '%s\n' \
            'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth' \
            "subjectAltName=DNS:$idp_host" > "$work_dir/tls/server.ext"
          openssl x509 -req -sha256 -days 1 \
            -in "$work_dir/tls/server.csr" \
            -CA "$work_dir/tls/ca.crt" -CAkey "$work_dir/tls/ca.key" -CAcreateserial \
            -extfile "$work_dir/tls/server.ext" -out "$work_dir/tls/server.crt"
          chmod 644 "$work_dir/tls/ca.crt" "$work_dir/tls/server.crt"
          sudo -n chown 1001:1001 "$work_dir/jwt"
          docker run --rm --entrypoint node \
            -e CROP_SMOKE_MATERIAL_DIR=/smoke-materials \
            -v "$PWD/scripts/ci:/smoke-scripts:ro" \
            -v "$work_dir/jwt:/smoke-materials" \
            chumon-hub:ci /smoke-scripts/crop-smoke.mjs prepare

      - name: Start fake Access IdP
        timeout-minutes: 3
        run: |
          work_dir="$RUNNER_TEMP/$CROP_SMOKE_SUBDIR"
          docker network create "$CROP_SMOKE_NETWORK"
          docker run -d --name chumon-ci-access-idp --user 0:0 --entrypoint node \
            --network "$CROP_SMOKE_NETWORK" \
            --network-alias "$CLOUDFLARE_TEAM_DOMAIN.cloudflareaccess.com" \
            -e CLOUDFLARE_TEAM_DOMAIN \
            -e NODE_EXTRA_CA_CERTS=/smoke-materials/ca.crt \
            -e ACCESS_IDP_KEY_FILE=/smoke-materials/server.key \
            -e ACCESS_IDP_CERT_FILE=/smoke-materials/server.crt \
            -e ACCESS_IDP_JWKS_FILE=/smoke-materials/jwks.json \
            -v "$PWD/scripts/ci:/smoke-scripts:ro" \
            -v "$work_dir/tls/server.key:/smoke-materials/server.key:ro" \
            -v "$work_dir/tls/server.crt:/smoke-materials/server.crt:ro" \
            -v "$work_dir/tls/ca.crt:/smoke-materials/ca.crt:ro" \
            -v "$work_dir/jwt/jwks.json:/smoke-materials/jwks.json:ro" \
            chumon-hub:ci /smoke-scripts/fake-access-idp.mjs
          for attempt in $(seq 1 30); do
            if [[ "$(docker inspect -f '{{.State.Running}}' chumon-ci-access-idp)" != 'true' ]]; then
              echo '::error::IdP 側の問題: コンテナが終了しました'
              exit 1
            fi
            if docker exec chumon-ci-access-idp node --input-type=module -e '
              try {
                const issuer = `https://${process.env.CLOUDFLARE_TEAM_DOMAIN}.cloudflareaccess.com`
                const response = await fetch(`${issuer}/cdn-cgi/access/certs`, {
                  signal: AbortSignal.timeout(2000),
                })
                if (response.status !== 200) throw new Error("Unexpected status")
                const jwks = await response.json()
                if (!Array.isArray(jwks.keys) || !jwks.keys.some(key => typeof key.kid === "string")) {
                  throw new Error("Missing JWKS kid")
                }
              } catch {
                process.exitCode = 1
              }
            '; then
              echo "Fake Access IdP ready: trusted TLS and JWKS ($attempt attempts)"
              exit 0
            fi
            sleep 2
          done
          echo '::error::IdP 側の問題: 到達確認が制限回数内に成功しませんでした'
          exit 1

      # ビルド成功だけでは実行時の起動失敗を検知できないため、
      # 実際にコンテナを起動して / が 200 を返すことまで確認する.
      # 検証パスの / は proxy.ts の matcher 外なので Cloudflare Access なしで応答する.
      - name: Start container
        run: |
          work_dir="$RUNNER_TEMP/$CROP_SMOKE_SUBDIR"
          docker run -d --name chumon-hub-smoke -p 3000:3000 \
            --network "$CROP_SMOKE_NETWORK" \
            -e CLOUDFLARE_TEAM_DOMAIN -e CLOUDFLARE_AUDIENCE \
            -e NODE_EXTRA_CA_CERTS=/smoke-materials/ca.crt \
            -v "$work_dir/tls/ca.crt:/smoke-materials/ca.crt:ro" \
            chumon-hub:ci

      - name: Smoke test (HTTP 200 on /)
        run: |
          for i in $(seq 1 30); do
            if ! docker ps --filter 'name=chumon-hub-smoke' --filter 'status=running' --quiet | grep -q .; then
              echo "::error::コンテナが起動直後に終了しました"
              exit 1
            fi
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "スモーク成功: / が 200 を返しました (${i} 回目の試行)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::60 秒以内に / が 200 を返しませんでした (最後の応答: ${code:-none})"
          exit 1

      - name: Smoke test (authenticated crop through production bundle)
        timeout-minutes: 5
        run: |
          work_dir="$RUNNER_TEMP/$CROP_SMOKE_SUBDIR"
          docker run --rm --entrypoint node \
            --network "$CROP_SMOKE_NETWORK" \
            -e CLOUDFLARE_TEAM_DOMAIN -e CLOUDFLARE_AUDIENCE \
            -e CROP_SMOKE_CLAIM_MARKER \
            -e NODE_EXTRA_CA_CERTS=/smoke-materials/ca.crt \
            -e CROP_SMOKE_MATERIAL_DIR=/smoke-materials \
            -e CROP_SMOKE_APP_URL=http://chumon-hub-smoke:3000 \
            -v "$PWD/scripts/ci:/smoke-scripts:ro" \
            -v "$work_dir/jwt/private.pem:/smoke-materials/private.pem:ro" \
            -v "$work_dir/jwt/jwks.json:/smoke-materials/jwks.json:ro" \
            -v "$work_dir/tls/ca.crt:/smoke-materials/ca.crt:ro" \
            chumon-hub:ci /smoke-scripts/crop-smoke.mjs run

      # pdfjs は同梱データの解決に失敗しても警告だけで処理を続け、白い画像を返しうる.
      # HTTP 成功だけでは見逃すため、固定文言の警告も失敗として扱う.
      - name: Check crop renderer warnings
        run: |
          logs=$(docker logs chumon-hub-smoke 2>&1)
          if grep -Fq 'PDF renderer emitted a warning' <<< "$logs"; then
            echo '::error::PDF renderer emitted a warning'
            exit 1
          fi
          echo 'Crop renderer warnings: none'

      # 認証失敗時に JWT のクレームがアプリログへ出ないことを検査する.
      # wrong-audience はクレーム検証まで到達するため、payload の漏えいを検知できる.
      - name: Check auth claim leakage
        run: |
          logs=$(docker logs chumon-hub-smoke 2>&1)
          if grep -Fq "$CROP_SMOKE_CLAIM_MARKER" <<< "$logs"; then
            echo '::error::JWT claims leaked into application logs'
            exit 1
          fi
          echo 'Auth claim leakage: none'

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs chumon-hub-smoke || true
          docker logs chumon-ci-access-idp || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f chumon-hub-smoke || true
          docker rm -f chumon-ci-access-idp || true
          docker network rm "$CROP_SMOKE_NETWORK" || true
          sudo -n rm -rf -- "$RUNNER_TEMP/$CROP_SMOKE_SUBDIR"

  quality:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format:check
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Test pre-push main guard
        if: ${{ !cancelled() }}
        run: bash scripts/githooks/test-pre-push.sh
