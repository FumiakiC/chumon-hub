# Temporary measurement only: remove this workflow and scripts/ci/tmp-memory
# before merging this PR. No production deployment. The measured image is pushed
# only as ghcr.io/fumiakic/chumon-hub:tmp-pr399-<head SHA> after a pass; :latest is never changed.
# Re-running a run for the same head can overwrite that tag with a different (rebuilt) image.
name: Temporary base image memory comparison

on:
  pull_request:
    branches: [main]

permissions: {}

env:
  OLD_IMAGE: ghcr.io/fumiakic/chumon-hub@sha256:fe1501549950c0f0b2e32de29547af4a379bbb29f891bdb618d4afd5f071f2a5
  OLD_SOURCE_SHA: 09446ba140df74c45af47c12e4a208c3feb0e7d2
  PEAK_LIMIT_MIB: 435
  RELATIVE_LIMIT: 1.15
  RUNS: 3
  ROUNDS: 10
  CONCURRENCY: 2

jobs:
  compare:
    if: github.head_ref == 'chore/base-image-trixie'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # packages: write is needed only by the final push of a passing image. The
    # job token keeps this permission until the job ends, even while the runner
    # holds no stored GHCR credentials (see the logout steps).
    permissions:
      contents: read
      packages: write
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NEW_IMAGE: chumon-hub:tmp-memory
      CLOUDFLARE_TEAM_DOMAIN: chumon-ci
      CLOUDFLARE_AUDIENCE: chumon-ci-smoke
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Initialize evidence outside the worktree
        run: |
          base="$RUNNER_TEMP/chumon-tmp-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export MEMORY_ROOT="$base/results"
          mkdir -p "$MEMORY_ROOT"
          {
            echo "MEMORY_ROOT=$MEMORY_ROOT"
            echo "MEMORY_MATERIALS=$base/materials"
            echo "MEMORY_PREFIX=tmp-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MEMORY_NETWORK=tmp-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const env = process.env
          writeFileSync(`${env.MEMORY_ROOT}/metadata.json`, JSON.stringify({
            startedAtMs: Date.now(),
            expectedHeadSha: env.EXPECTED_HEAD_SHA,
            headSha: null,
            oldSourceSha: env.OLD_SOURCE_SHA,
            oldImage: env.OLD_IMAGE,
            newImage: env.NEW_IMAGE,
            constants: {
              peakLimitMiB: Number(env.PEAK_LIMIT_MIB),
              relativeLimit: Number(env.RELATIVE_LIMIT),
              runs: Number(env.RUNS),
              rounds: Number(env.ROUNDS),
              concurrency: Number(env.CONCURRENCY),
            },
            gates: { sha: false, diff: false, digest: false, versions: false },
            versionGate: null,
            smallMemoryStartup: null,
            difference: null,
            environment: {},
            infrastructure: [],
            preparationComplete: false,
            measurementsComplete: false,
          }, null, 2) + '\n')
          NODE

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked out SHA and changed-file allowlist
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/metadata.json`
          const metadata = JSON.parse(readFileSync(path, 'utf8'))
          metadata.headSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          metadata.gates.sha = metadata.headSha === process.env.EXPECTED_HEAD_SHA
          metadata.difference = execFileSync('git', [
            'diff', '--name-only', '-z', process.env.OLD_SOURCE_SHA, metadata.headSha,
          ], { encoding: 'utf8' }).split('\0').filter(Boolean)
          metadata.gates.diff = metadata.difference.every(path =>
            /^(Dockerfile$|\.devcontainer\/|\.github\/|scripts\/ci\/|docs\/)/.test(path))
          const clean = execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], {
            encoding: 'utf8',
          }) === ''
          if (!metadata.gates.sha) metadata.infrastructure.push('CHECKOUT_SHA_MISMATCH')
          if (!metadata.gates.diff) metadata.infrastructure.push('DIFF_ALLOWLIST_VIOLATION')
          if (!clean) metadata.infrastructure.push('BUILD_WORKTREE_NOT_CLEAN')
          writeFileSync(path, JSON.stringify(metadata, null, 2) + '\n')
          if (!metadata.gates.sha || !metadata.gates.diff || !clean) process.exitCode = 1
          NODE

      # The job token can write packages; it is used here only to pull the old image.
      - name: Log in to GHCR (pull of the old image)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and verify the old image digest
        run: |
          docker pull --platform linux/amd64 "$OLD_IMAGE"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/metadata.json`
          const metadata = JSON.parse(readFileSync(path, 'utf8'))
          const digests = JSON.parse(execFileSync('docker', [
            'image', 'inspect', '--format', '{{json .RepoDigests}}', process.env.OLD_IMAGE,
          ], { encoding: 'utf8' }))
          metadata.oldRepoDigests = digests
          metadata.gates.digest = Array.isArray(digests) && digests.includes(process.env.OLD_IMAGE)
          if (!metadata.gates.digest) metadata.infrastructure.push('OLD_DIGEST_MISMATCH')
          writeFileSync(path, JSON.stringify(metadata, null, 2) + '\n')
          if (!metadata.gates.digest) process.exitCode = 1
          NODE

      # Removes only the credentials stored on the runner. The job token and its
      # packages: write permission stay valid until the job ends; the build,
      # measurement, and aggregation steps never receive the token.
      - name: Log out of GHCR before building and measuring
        if: always()
        run: docker logout ghcr.io

      - uses: docker/setup-buildx-action@v4

      - name: Build exactly the checked worktree
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.NEW_IMAGE }}

      - name: Verify the build did not change its inputs
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Record host and image environments
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/metadata.json`
          const metadata = JSON.parse(readFileSync(path, 'utf8'))
          metadata.diagnostics ??= []
          function capture(command, args) {
            const result = spawnSync(command, args, { encoding: 'utf8', timeout: 30000 })
            if (result.status !== 0) metadata.infrastructure.push('ENVIRONMENT_COMMAND_FAILED')
            return (result.stdout || '') + (result.stderr || '')
          }
          function runtime(name, image) {
            // canvas: version from its own package.json; platform packages are recorded only.
            const script = `
              const fs = require('fs')
              const path = require('path')
              let canvasVersion = null
              let canvasPlatformPackages = null
              try {
                const dir = fs.realpathSync('/app/node_modules/@napi-rs/canvas')
                const value = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8')).version
                if (typeof value === 'string' && value) canvasVersion = value
                canvasPlatformPackages = fs.readdirSync(path.dirname(dir))
                  .filter(entry => entry.startsWith('canvas-')).sort()
                  .map(entry => '@napi-rs/' + entry)
              } catch {}
              process.stdout.write(JSON.stringify({
                versions: process.versions,
                glibcVersionRuntime: process.report.getReport().header.glibcVersionRuntime ?? null,
                canvasVersion,
                canvasPlatformPackages,
              }))
            `
            try {
              const result = spawnSync('docker', [
                'run', '--rm', '--name', `${process.env.MEMORY_PREFIX}-runtime-${name}`,
                '--entrypoint', 'node', image, '-e', script,
              ], { encoding: 'utf8', timeout: 30000 })
              if (result.status !== 0) throw new Error('RUNTIME_UNAVAILABLE')
              const value = JSON.parse(result.stdout)
              if (!value || !value.versions || typeof value.versions !== 'object' ||
                  Array.isArray(value.versions) ||
                  Object.values(value.versions).some(version => typeof version !== 'string') ||
                  ['node', 'v8', 'uv'].some(key => !value.versions[key]) ||
                  !(value.glibcVersionRuntime === null || typeof value.glibcVersionRuntime === 'string') ||
                  !(value.canvasVersion === null || typeof value.canvasVersion === 'string') ||
                  !(value.canvasPlatformPackages === null ||
                    (Array.isArray(value.canvasPlatformPackages) &&
                      value.canvasPlatformPackages.every(entry => typeof entry === 'string')))) {
                throw new Error('RUNTIME_UNAVAILABLE')
              }
              return value
            } catch {
              metadata.diagnostics.push(`RUNTIME_VERSIONS_UNAVAILABLE:${name}`)
              return null
            }
          }
          function imageGlibcTunables(image) {
            const result = spawnSync('docker', [
              'image', 'inspect', '--format', '{{json .Config.Env}}', image,
            ], { encoding: 'utf8', timeout: 30000 })
            try {
              if (result.status !== 0) throw new Error('IMAGE_ENV_UNAVAILABLE')
              const environment = JSON.parse(result.stdout) ?? []
              if (!Array.isArray(environment) ||
                  environment.some(value => typeof value !== 'string')) {
                throw new Error('IMAGE_ENV_UNAVAILABLE')
              }
              const values = environment.filter(value => value.startsWith('GLIBC_TUNABLES='))
              if (values.length > 1) throw new Error('IMAGE_ENV_UNAVAILABLE')
              return values[0]?.slice('GLIBC_TUNABLES='.length) ?? null
            } catch {
              metadata.infrastructure.push('IMAGE_ENV_UNAVAILABLE')
              return null
            }
          }
          // Records the dynamic loader's view with the image's own settings (nothing injected).
          function tunables() {
            const values = { arenaMax: null, mmapThreshold: null }
            try {
              const result = spawnSync('docker', [
                'run', '--rm', '--name', `${process.env.MEMORY_PREFIX}-tunables-new`,
                '--entrypoint', '/lib64/ld-linux-x86-64.so.2',
                process.env.NEW_IMAGE, '--list-tunables',
              ], { encoding: 'utf8', timeout: 30000 })
              if (result.status !== 0) throw new Error('TUNABLES_UNAVAILABLE')
              for (const [key, name] of [
                ['arenaMax', 'glibc.malloc.arena_max'],
                ['mmapThreshold', 'glibc.malloc.mmap_threshold'],
              ]) {
                const lines = result.stdout.split('\n').filter(line => line.startsWith(`${name}:`))
                const value = lines.length === 1 ? lines[0].split(/\s+/)[1] : null
                if (typeof value === 'string' && /^0x[0-9a-f]+$/.test(value)) {
                  values[key] = value
                }
              }
            } catch {
              // A failed command has no trustworthy values.
            }
            if (Object.values(values).some(value => value === null)) {
              metadata.diagnostics.push('TUNABLES_UNAVAILABLE:new')
            }
            return values
          }
          function hostCpu() {
            let cpuModel = null
            let nproc = null
            try {
              const line = readFileSync('/proc/cpuinfo', 'utf8').split('\n')
                .find(line => /^model name\s*:/.test(line))
              const value = line?.slice(line.indexOf(':') + 1).trim()
              if (value) cpuModel = value
            } catch {
              // Keep the independently collected processor count.
            }
            try {
              const result = spawnSync('nproc', [], { encoding: 'utf8', timeout: 30000 })
              const value = result.stdout?.trim()
              const count = Number(value)
              if (result.status === 0 && /^[0-9]+$/.test(value ?? '') &&
                  Number.isSafeInteger(count) && count > 0) {
                nproc = count
              }
            } catch {
              // Keep the independently collected model name.
            }
            if (cpuModel === null || nproc === null) {
              metadata.diagnostics.push('HOST_CPU_UNAVAILABLE')
            }
            return { cpuModel, nproc }
          }
          metadata.environment.kernel = capture('uname', ['-r']).trim()
          metadata.environment.cgroupFilesystem = capture('stat', ['-fc', '%T', '/sys/fs/cgroup']).trim()
          metadata.environment.dockerVersion = capture('docker', ['version'])
          for (const [name, image] of [['old', process.env.OLD_IMAGE], ['new', process.env.NEW_IMAGE]]) {
            metadata.environment[name] = {
              id: capture('docker', ['image', 'inspect', '--format', '{{.Id}}', image]).trim(),
              user: capture('docker', [
                'run', '--rm', '--name', `${process.env.MEMORY_PREFIX}-user-${name}`,
                '--entrypoint', 'sh', image,
                '-c', 'id; echo "$HOME"; ls -ld "$HOME"',
              ]),
              runtime: runtime(name, image),
              imageGlibcTunables: imageGlibcTunables(image),
            }
          }
          Object.assign(metadata.environment.new, tunables())
          Object.assign(metadata.environment, hostCpu())
          // Version gate: a mismatch or a missing value aborts before any measurement.
          // libc and the canvas platform package names are recorded only.
          const pick = {
            node: runtime => runtime?.versions?.node,
            v8: runtime => runtime?.versions?.v8,
            uv: runtime => runtime?.versions?.uv,
            canvas: runtime => runtime?.canvasVersion,
          }
          const fields = Object.entries(pick).map(([field, read]) => {
            const value = image => {
              const found = read(metadata.environment[image].runtime)
              return typeof found === 'string' && found ? found : null
            }
            const old = value('old')
            const current = value('new')
            return { field, old, new: current, match: old !== null && old === current }
          })
          const unavailable = fields.some(entry => entry.old === null || entry.new === null)
          metadata.versionGate = { fields }
          metadata.gates.versions = fields.every(entry => entry.match)
          if (unavailable) metadata.infrastructure.push('VERSION_GATE_UNAVAILABLE')
          else if (!metadata.gates.versions) metadata.infrastructure.push('VERSION_GATE_MISMATCH')
          if (metadata.environment.cgroupFilesystem !== 'cgroup2fs') {
            metadata.infrastructure.push('CGROUP_V2_REQUIRED')
          }
          writeFileSync(path, JSON.stringify(metadata, null, 2) + '\n')
          if (metadata.infrastructure.length) process.exitCode = 1
          NODE

      # The image store decides what docker's image ID means: with the classic
      # store it is the config digest; with the containerd snapshotter it is the
      # index/manifest digest. The config digest from `docker save` means the same
      # in both, so the post-push identity check compares config digests.
      - name: Record the image store and the new image config digest
        run: |
          scratch="$RUNNER_TEMP/chumon-tmp-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/save-manifest.json"
          set +e
          docker save "$NEW_IMAGE" | tar -xOf - manifest.json > "$scratch"
          statuses=("${PIPESTATUS[@]}")
          set -e
          SAVE_STATUS="${statuses[0]}" TAR_STATUS="${statuses[1]}" SAVE_MANIFEST="$scratch" \
            node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { readFileSync, rmSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/metadata.json`
          const metadata = JSON.parse(readFileSync(path, 'utf8'))
          const fail = code => {
            if (!metadata.infrastructure.includes(code)) metadata.infrastructure.push(code)
          }
          const info = spawnSync('docker', ['info', '--format', '{{json .DriverStatus}}'], {
            encoding: 'utf8', timeout: 30000,
          })
          let imageStore = null
          try {
            if (info.status !== 0) throw new Error('DOCKER_INFO_FAILED')
            const status = JSON.parse(info.stdout) ?? []
            if (!Array.isArray(status)) throw new Error('DOCKER_INFO_FAILED')
            imageStore = status.some(entry => Array.isArray(entry) &&
              entry.includes('io.containerd.snapshotter.v1')) ? 'containerd' : 'classic'
          } catch {
            fail('IMAGE_STORE_UNAVAILABLE')
          }
          metadata.environment.imageStore = imageStore
          let configDigest = null
          try {
            if (process.env.SAVE_STATUS !== '0' || process.env.TAR_STATUS !== '0') {
              throw new Error('PIPELINE_FAILED')
            }
            const manifest = JSON.parse(readFileSync(process.env.SAVE_MANIFEST, 'utf8'))
            const config = Array.isArray(manifest) && manifest.length === 1 &&
              typeof manifest[0]?.Config === 'string' ? manifest[0].Config : ''
            const match = /^(?:blobs\/sha256\/([a-f0-9]{64})|([a-f0-9]{64})\.json)$/.exec(config)
            if (!match) throw new Error('UNEXPECTED_MANIFEST')
            configDigest = `sha256:${match[1] ?? match[2]}`
          } catch {
            fail('NEW_IMAGE_CONFIG_DIGEST_UNAVAILABLE')
          } finally {
            rmSync(process.env.SAVE_MANIFEST, { force: true })
          }
          metadata.environment.new.configDigest = configDigest
          if (imageStore === 'classic' && configDigest !== null &&
              metadata.environment.new.id !== configDigest) {
            fail('NEW_IMAGE_ID_CONFIG_MISMATCH')
          }
          writeFileSync(path, JSON.stringify(metadata, null, 2) + '\n')
          if (metadata.infrastructure.length) process.exitCode = 1
          NODE

      # Same check as ci.yml: deploy.yml's pull check runs node --version in a
      # 32Mi-limited Pod on the production node. A failure stops before measuring.
      - name: Check startup of the measured image under 32MiB
        run: |
          name="$MEMORY_PREFIX-32mi"
          set +e
          docker run --name "$name" --memory=32m --memory-swap=32m \
            --entrypoint node "$NEW_IMAGE" --version
          status=$?
          set -e
          oom=$(docker inspect -f '{{.State.OOMKilled}}' "$name" || echo unknown)
          docker rm -f "$name" >/dev/null 2>&1 || true
          STARTUP_STATUS="$status" STARTUP_OOM="$oom" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/metadata.json`
          const metadata = JSON.parse(readFileSync(path, 'utf8'))
          const exitCode = Number(process.env.STARTUP_STATUS)
          const oomKilled = process.env.STARTUP_OOM === 'true' ? true
            : process.env.STARTUP_OOM === 'false' ? false : null
          const success = exitCode === 0 && oomKilled === false
          metadata.smallMemoryStartup = {
            result: success ? 'success' : 'failure',
            memoryLimit: '32m',
            exitCode: Number.isSafeInteger(exitCode) ? exitCode : null,
            oomKilled,
          }
          if (!success) metadata.infrastructure.push('NEW_IMAGE_32MI_STARTUP_FAILED')
          writeFileSync(path, JSON.stringify(metadata, null, 2) + '\n')
          if (!success) {
            process.stdout.write('::error::32MiB で node --version が失敗しました\n')
            process.exitCode = 1
          }
          NODE

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate deterministic synthetic PDFs
        run: pnpm exec tsx scripts/ci/tmp-memory/fixtures.ts "$MEMORY_ROOT/fixtures"

      - name: Prepare crop smoke materials
        timeout-minutes: 3
        run: |
          work_dir="$MEMORY_MATERIALS"
          idp_host="$CLOUDFLARE_TEAM_DOMAIN.cloudflareaccess.com"
          mkdir -p "$work_dir/tls" "$work_dir/jwt"
          chmod 755 "$work_dir" "$work_dir/tls" "$work_dir/jwt"
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=Disposable CI Access CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$work_dir/tls/ca.key" -out "$work_dir/tls/ca.crt"
          openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -subj "/CN=$idp_host" \
            -keyout "$work_dir/tls/server.key" -out "$work_dir/tls/server.csr"
          printf '%s\n' \
            'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth' \
            "subjectAltName=DNS:$idp_host" > "$work_dir/tls/server.ext"
          openssl x509 -req -sha256 -days 1 \
            -in "$work_dir/tls/server.csr" \
            -CA "$work_dir/tls/ca.crt" -CAkey "$work_dir/tls/ca.key" -CAcreateserial \
            -extfile "$work_dir/tls/server.ext" -out "$work_dir/tls/server.crt"
          chmod 644 "$work_dir/tls/ca.crt" "$work_dir/tls/server.crt"
          sudo -n chown 1001:1001 "$work_dir/jwt"
          docker run --rm --name "$MEMORY_PREFIX-prepare" --entrypoint node \
            -e CROP_SMOKE_MATERIAL_DIR=/smoke-materials \
            -v "$PWD/scripts/ci:/smoke-scripts:ro" \
            -v "$work_dir/jwt:/smoke-materials" \
            "$NEW_IMAGE" /smoke-scripts/crop-smoke.mjs prepare

      - name: Start fake Access IdP
        timeout-minutes: 3
        run: |
          work_dir="$MEMORY_MATERIALS"
          docker network create "$MEMORY_NETWORK"
          docker run -d --name "$MEMORY_PREFIX-idp" --user 0:0 --entrypoint node \
            --network "$MEMORY_NETWORK" \
            --network-alias "$CLOUDFLARE_TEAM_DOMAIN.cloudflareaccess.com" \
            -e CLOUDFLARE_TEAM_DOMAIN \
            -e NODE_EXTRA_CA_CERTS=/smoke-materials/ca.crt \
            -e ACCESS_IDP_KEY_FILE=/smoke-materials/server.key \
            -e ACCESS_IDP_CERT_FILE=/smoke-materials/server.crt \
            -e ACCESS_IDP_JWKS_FILE=/smoke-materials/jwks.json \
            -v "$PWD/scripts/ci:/smoke-scripts:ro" \
            -v "$work_dir/tls/server.key:/smoke-materials/server.key:ro" \
            -v "$work_dir/tls/server.crt:/smoke-materials/server.crt:ro" \
            -v "$work_dir/tls/ca.crt:/smoke-materials/ca.crt:ro" \
            -v "$work_dir/jwt/jwks.json:/smoke-materials/jwks.json:ro" \
            "$NEW_IMAGE" /smoke-scripts/fake-access-idp.mjs
          for attempt in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Running}}' "$MEMORY_PREFIX-idp")" = true
            if docker exec "$MEMORY_PREFIX-idp" node --input-type=module -e '
              try {
                const issuer = `https://${process.env.CLOUDFLARE_TEAM_DOMAIN}.cloudflareaccess.com`
                const response = await fetch(`${issuer}/cdn-cgi/access/certs`, {
                  signal: AbortSignal.timeout(2000),
                })
                if (response.status !== 200) throw new Error("Unexpected status")
                const jwks = await response.json()
                if (!Array.isArray(jwks.keys) || !jwks.keys.some(key => typeof key.kid === "string")) {
                  throw new Error("Missing JWKS kid")
                }
              } catch {
                process.exitCode = 1
              }
            '; then
              node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/metadata.json`
          const metadata = JSON.parse(readFileSync(path, 'utf8'))
          metadata.preparationComplete = true
          writeFileSync(path, JSON.stringify(metadata, null, 2) + '\n')
          NODE
              exit 0
            fi
            sleep 2
          done
          echo '::error::Fake Access IdP did not become ready'
          exit 1

      - name: Measure isolated containers (host cgroup peak)
        run: |
          sudo -n env \
            MEMORY_ROOT="$MEMORY_ROOT" MEMORY_MATERIALS="$MEMORY_MATERIALS" \
            MEMORY_PREFIX="$MEMORY_PREFIX" MEMORY_NETWORK="$MEMORY_NETWORK" \
            NEW_IMAGE="$NEW_IMAGE" OLD_IMAGE="$OLD_IMAGE" RUNS="$RUNS" \
            CONCURRENCY="$CONCURRENCY" ROUNDS="$ROUNDS" \
            CLOUDFLARE_TEAM_DOMAIN="$CLOUDFLARE_TEAM_DOMAIN" \
            CLOUDFLARE_AUDIENCE="$CLOUDFLARE_AUDIENCE" \
            "$(command -v node)" scripts/ci/tmp-memory/load.mjs measure

      - name: Preserve any remaining container evidence before aggregation
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { mkdirSync, writeFileSync } from 'node:fs'
          const directory = `${process.env.MEMORY_ROOT}/remaining-containers`
          mkdirSync(directory, { recursive: true })
          for (const suffix of ['target', 'load', 'idp', 'prepare', 'user-old', 'user-new']) {
            const name = `${process.env.MEMORY_PREFIX}-${suffix}`
            const info = spawnSync('docker', ['inspect', name], { encoding: 'utf8', timeout: 20000 })
            if (info.status !== 0) continue
            const inspected = JSON.parse(info.stdout)[0]
            writeFileSync(`${directory}/${suffix}-state.json`, JSON.stringify({
              State: inspected.State, RestartCount: inspected.RestartCount,
            }, null, 2) + '\n')
            const logs = spawnSync('docker', ['logs', name], { encoding: 'utf8', timeout: 20000 })
            writeFileSync(`${directory}/${suffix}.log`, (logs.stdout || '') + (logs.stderr || ''))
            if (logs.status !== 0) throw new Error('Container evidence capture failed')
          }
          NODE

      - name: Aggregate and decide
        if: always()
        run: |
          if [ -f scripts/ci/tmp-memory/summarize.mjs ]; then
            status=0
            node scripts/ci/tmp-memory/summarize.mjs "$MEMORY_ROOT" || status=$?
            printf '%s\n' "$status" > "$MEMORY_ROOT/aggregate-exit-code.txt"
          else
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const root = process.env.MEMORY_ROOT
          const result = { verdict: '中断', label: '中断', exitCode: 2,
            incompleteRecords: ['checkout: summarizer unavailable'] }
          writeFileSync(`${root}/result.json`, JSON.stringify(result) + '\n')
          const lines = ['# 総合判定: 中断', '', '## fixture ごとの新旧最大値', '',
            '| Fixture | 旧 最大 MiB | 新 最大 MiB |', '|---|---:|---:|',
            ...['F0', 'F1', 'F2', 'F3'].map(f => `| ${f} | — | — |`), '',
            '## 24 回の詳細', '', '| Image | Fixture | Run | 状態 |', '|---|---|---:|---|']
          for (const image of ['old', 'new']) for (const fixture of ['F0', 'F1', 'F2', 'F3'])
            for (let run = 1; run <= 3; run++) lines.push(`| ${image} | ${fixture} | ${run} | missing |`)
          lines.push('', '## 環境・SHA・差分・実行ユーザー', '',
            `Expected head SHA: ${process.env.EXPECTED_HEAD_SHA}`, '',
            'checkout failed; environment unavailable', '',
            '## 不完全な記録の識別子', '', '- checkout: summarizer unavailable', '')
          writeFileSync(`${root}/summary.md`, lines.join('\n'))
          NODE
          fi

      # Push gate. not-applicable (exit 0): a previous step failed, the PR head is
      # not a branch of this repository, or the verdict is not pass. anomaly (exit 1):
      # a normal passing measurement whose records or local image do not hold.
      # Writes push.json and push=false before exiting in both cases.
      - name: Decide whether to push the measured image
        id: push-gate
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs'
          const root = process.env.MEMORY_ROOT
          const read = file => {
            try {
              return JSON.parse(readFileSync(`${root}/${file}`, 'utf8'))
            } catch {
              return null
            }
          }
          const metadata = read('metadata.json')
          const result = read('result.json')
          const headSha = process.env.EXPECTED_HEAD_SHA ?? ''
          const validSha = /^[a-f0-9]{40}$/.test(headSha)
          const digest = value => typeof value === 'string' && /^sha256:[a-f0-9]{64}$/.test(value)
          const record = {
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            headSha: validSha ? headSha : null,
            ref: validSha ? `ghcr.io/fumiakic/chumon-hub:tmp-pr399-${headSha}` : null,
            imageStore: metadata?.environment?.imageStore ?? null,
            measuredImageId: metadata?.environment?.new?.id ?? null,
            measuredConfigDigest: metadata?.environment?.new?.configDigest ?? null,
            outcome: 'not-applicable',
            reasons: [],
            pushed: false,
            verification: 'not-run',
            failure: null,
            checks: {},
            digests: { index: null, manifest: null, config: null, pushOutput: null },
            tagReference: { digest: null, matchesPushed: null, failure: null },
          }
          const reason = code => record.reasons.push(code)
          if (process.env.JOB_STATUS !== 'success') reason('PREVIOUS_STEP_FAILED')
          if (process.env.SAME_REPOSITORY !== 'true') reason('NOT_SAME_REPOSITORY')
          // An unreadable result.json leaves the verdict unknown; it is judged below as an anomaly.
          if (result && (result.verdict !== '合格' || result.exitCode !== 0)) reason('VERDICT_NOT_PASS')
          if (record.reasons.length === 0) {
            record.outcome = 'anomaly'
            if (!result) reason('RESULT_UNREADABLE')
            if (!metadata) reason('METADATA_UNREADABLE')
            if (!validSha || metadata?.headSha !== headSha) reason('HEAD_SHA_MISMATCH')
            if (metadata?.smallMemoryStartup?.result !== 'success') {
              reason('SMALL_MEMORY_STARTUP_NOT_SUCCESS')
            }
            if (!digest(record.measuredImageId)) reason('MEASURED_IMAGE_ID_MISSING')
            if (!digest(record.measuredConfigDigest)) reason('MEASURED_CONFIG_DIGEST_MISSING')
            const current = spawnSync('docker', [
              'image', 'inspect', '--format', '{{.Id}}', process.env.NEW_IMAGE,
            ], { encoding: 'utf8', timeout: 30000 })
            record.checks.prePushImageId = current.status === 0 ? current.stdout.trim() : null
            if (!digest(record.checks.prePushImageId) ||
              record.checks.prePushImageId !== record.measuredImageId) {
              reason('IMAGE_ID_CHANGED_SINCE_MEASUREMENT')
            }
            const measured = Array.isArray(result?.measurements)
              ? result.measurements.filter(entry => entry?.image === 'new') : []
            record.checks.measuredContainersMatchingImage =
              measured.filter(entry => entry.targetImageId === record.measuredImageId).length
            if (measured.length !== 12 || record.checks.measuredContainersMatchingImage !== 12) {
              reason('MEASURED_CONTAINER_IMAGE_MISMATCH')
            }
            if (record.reasons.length === 0) record.outcome = 'eligible'
          }
          const push = record.outcome === 'eligible'
          writeFileSync(`${root}/push.json`, JSON.stringify(record, null, 2) + '\n')
          appendFileSync(process.env.GITHUB_OUTPUT, `push=${push}\n`)
          if (record.outcome === 'anomaly') {
            process.stdout.write(`::error::push の判定が異常: ${record.reasons.join(', ')}\n`)
            process.exitCode = 1
          }
          NODE

      # Stored credentials exist only between this login and the logout below.
      - name: Log in to GHCR for the push only
        if: steps.push-gate.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pushes the local image used for the measurement (no rebuild, no artifact).
      # A failed post-push check fails the job but keeps the tag; push.json keeps the ref and digests.
      - name: Push the measured image and verify its identity
        if: steps.push-gate.outputs.push == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = `${process.env.MEMORY_ROOT}/push.json`
          const record = JSON.parse(readFileSync(path, 'utf8'))
          const save = () => writeFileSync(path, JSON.stringify(record, null, 2) + '\n')
          const repository = 'ghcr.io/fumiakic/chumon-hub'
          const digest = value => typeof value === 'string' && /^sha256:[a-f0-9]{64}$/.test(value)
          class PushError extends Error {
            constructor(code) {
              super(code)
              this.code = code
            }
          }
          function docker(args, code) {
            const result = spawnSync('docker', args, {
              encoding: 'utf8', timeout: 600000, maxBuffer: 64 * 1024 * 1024,
            })
            if (result.status !== 0) throw new PushError(code)
            return result.stdout
          }
          function raw(reference) {
            try {
              return JSON.parse(docker(['buildx', 'imagetools', 'inspect', reference, '--raw'],
                'REMOTE_INSPECT_FAILED'))
            } catch (error) {
              throw error instanceof PushError ? error : new PushError('REMOTE_INSPECT_INVALID')
            }
          }
          try {
            docker(['tag', process.env.NEW_IMAGE, record.ref], 'TAG_FAILED')
            record.checks.taggedImageId =
              docker(['image', 'inspect', '--format', '{{.Id}}', record.ref], 'TAG_INSPECT_FAILED').trim()
            if (record.checks.taggedImageId !== record.measuredImageId) {
              throw new PushError('TAGGED_IMAGE_ID_MISMATCH')
            }
            const output = docker(['push', record.ref], 'PUSH_FAILED')
            record.pushed = true
            save()
            const pushed = [...new Set([...output.matchAll(/digest: (sha256:[a-f0-9]{64})/g)]
              .map(match => match[1]))]
            if (pushed.length === 0) throw new PushError('PUSH_OUTPUT_DIGEST_MISSING')
            if (pushed.length !== 1) throw new PushError('PUSH_OUTPUT_DIGEST_AMBIGUOUS')
            record.digests.pushOutput = pushed[0]
            save()
            // Every fetch that decides the result is pinned to the pushed digest, never the tag.
            const body = raw(`${repository}@${record.digests.pushOutput}`)
            let manifest
            if (Array.isArray(body?.manifests)) {
              record.digests.index = record.digests.pushOutput
              const platforms = body.manifests.filter(entry =>
                entry?.platform?.os === 'linux' && entry?.platform?.architecture === 'amd64' &&
                !entry?.annotations?.['vnd.docker.reference.type'])
              if (platforms.length !== 1 || !digest(platforms[0].digest)) {
                throw new PushError('AMD64_MANIFEST_NOT_UNIQUE')
              }
              record.digests.manifest = platforms[0].digest
              manifest = raw(`${repository}@${platforms[0].digest}`)
            } else if (body?.config) {
              record.digests.manifest = record.digests.pushOutput
              manifest = body
            } else {
              throw new PushError('REMOTE_BODY_UNRECOGNIZED')
            }
            if (!digest(manifest?.config?.digest)) throw new PushError('REMOTE_CONFIG_DIGEST_MISSING')
            record.digests.config = manifest.config.digest
            record.checks.configMatchesMeasured = record.digests.config === record.measuredConfigDigest
            // Reference only: with the containerd store the local ID is the pushed top-level digest.
            record.checks.pushedDigestEqualsLocalImageId =
              record.digests.pushOutput === record.measuredImageId
            record.verification = record.checks.configMatchesMeasured ? 'passed' : 'failed'
            if (!record.checks.configMatchesMeasured) record.failure = 'CONFIG_DIGEST_MISMATCH'
          } catch (error) {
            record.verification = 'failed'
            record.failure = error instanceof PushError ? error.code : 'PUSH_STEP_FAILED'
          }
          // Reference only (not used for the result): what the tag points to at this moment.
          if (record.pushed) {
            try {
              const tag = JSON.parse(docker(['buildx', 'imagetools', 'inspect', record.ref,
                '--format', '{{json .Manifest}}'], 'TAG_INSPECT_FAILED'))
              record.tagReference.digest = digest(tag?.digest) ? tag.digest : null
              if (!record.tagReference.digest) record.tagReference.failure = 'TAG_DIGEST_MISSING'
            } catch (error) {
              record.tagReference.failure = error instanceof PushError ? error.code : 'TAG_INSPECT_INVALID'
            }
            if (record.tagReference.digest && record.digests.pushOutput) {
              record.tagReference.matchesPushed =
                record.tagReference.digest === record.digests.pushOutput
            }
          }
          save()
          if (record.verification !== 'passed') {
            process.stdout.write(`::error::push の同一性の検査が不成立: ${record.failure}\n`)
            process.exitCode = 1
          }
          NODE

      - name: Log out of GHCR after the push
        if: always()
        run: docker logout ghcr.io

      - name: Write the complete job summary once
        if: always()
        run: |
          {
            cat "$MEMORY_ROOT/summary.md"
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const text = value => value === null || value === undefined ? '—'
            : String(value).replaceAll('|', '\\|').replaceAll('\n', ' ')
          let record = null
          try {
            record = JSON.parse(readFileSync(`${process.env.MEMORY_ROOT}/push.json`, 'utf8'))
          } catch {
            // Reported below as missing.
          }
          const lines = ['', '## 合格した成果物の push', '']
          if (!record) {
            lines.push('push の記録なし（push していない）')
          } else {
            const outcome = {
              eligible: '対象（push の条件が成立）',
              'not-applicable': '対象外（push しない）',
              anomaly: '異常（合格した測定なのに push の前提が不成立。push しない）',
            }[record.outcome] ?? record.outcome
            const tag = record.tagReference ?? {}
            lines.push(
              `- run: ${text(record.runId)} (attempt ${text(record.runAttempt)})`,
              `- PR head SHA: ${text(record.headSha)}`,
              `- push 先: ${text(record.ref)}（:latest は変更しない）`,
              `- push の判定: ${text(outcome)}${record.reasons?.length ? `（${text(record.reasons.join(', '))}）` : ''}`,
              `- push: ${record.pushed ? '実施' : '未実施'}`,
              `- イメージストア: ${text(record.imageStore)}`,
              `- 測定したイメージの ID: ${text(record.measuredImageId)}`,
              `- 測定したイメージの config: ${text(record.measuredConfigDigest)}`,
              `- push の出力の digest（以後の取得はこの digest に固定）: ${text(record.digests?.pushOutput)}`,
              `- index digest: ${text(record.digests?.index)}`,
              `- manifest digest (linux/amd64): ${text(record.digests?.manifest)}`,
              `- config digest (push 後): ${text(record.digests?.config)}`,
              `- 同一性の検査: ${text(record.verification)}${record.failure ? `（${text(record.failure)}）` : ''}`,
              `- 参考: 検査の時点でタグが指す digest: ${text(tag.digest)}${tag.failure ? `（${text(tag.failure)}）` : ''}`,
            )
            if (tag.matchesPushed === false) {
              lines.push('- 参考: タグが push した digest と異なる digest を指していた（合否は push した digest で判定）')
            }
          }
          process.stdout.write(lines.join('\n') + '\n')
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve results, per-measurement evidence, and fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-base-image-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chumon-tmp-memory-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: 90
          if-no-files-found: error

      - name: Fail unless the overall verdict is pass
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync(`${process.env.MEMORY_ROOT}/result.json`, 'utf8'))
          if (result.verdict !== '合格' || result.exitCode !== 0) process.exitCode = 1
          NODE

      - name: Clean up only this job's temporary resources
        if: always()
        run: |
          for suffix in load target idp prepare user-old user-new runtime-old runtime-new tunables-new 32mi; do
            name="tmp-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$suffix"
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker rm -f "$name"
            fi
          done
          network="tmp-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker network inspect "$network" >/dev/null 2>&1; then
            docker network rm "$network"
          fi
          sudo -n env RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" "$(command -v node)" --input-type=module <<'NODE'
          import { rmSync } from 'node:fs'
          import { join } from 'node:path'
          const { RUNNER_TEMP, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT } = process.env
          if (!RUNNER_TEMP?.startsWith('/') || !/^\d+$/.test(GITHUB_RUN_ID) ||
              !/^\d+$/.test(GITHUB_RUN_ATTEMPT)) throw new Error('Invalid cleanup scope')
          const base = join(RUNNER_TEMP, `chumon-tmp-memory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}`)
          rmSync(join(base, 'materials'), { recursive: true, force: true })
          rmSync(join(base, 'results'), { recursive: true, force: true })
          NODE
