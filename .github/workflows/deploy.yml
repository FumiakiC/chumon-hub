name: Build and Deploy

on:
  push:
    branches: ['main']
    # ドキュメントのみの変更ではイメージ再ビルド・再デプロイを行わない。
    # ベースイメージ (node:26-alpine) が可変タグのため、ソースが同一でも
    # 再ビルドすると別物のイメージになりうる。不要な再デプロイは避ける。
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # 手動の再デプロイの入口。main 以外のブランチから起動した run は、本番のグループに入れず
  # （concurrency を参照）、build-push の条件でスキップする。
  workflow_dispatch:

# main の push と手動起動の全 run が同じ :latest イメージと deployment/chumon-hub を更新するため、
# 固定グループで全 run の push と rollout を直列化する。
# 実行中の run は止めず、待機中の run は後から来たものに置き換わる。グループ内の実行順は保証されない。
# main 以外から手動起動した run は、run ごとの別グループに入れる。同じグループに入れると、
# ジョブ条件でスキップされる run が main の待機中の run を置き換え、その変更が未反映のまま残るため。
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-production' || format('deploy-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

# GITHUB_TOKEN の権限はリポジトリ設定の既定値に依存させず、ここで全権限なしにする。
# 必要なジョブだけがジョブ単位で付与する（deploy ジョブは GITHUB_TOKEN を使わないため付与しない）。
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    # 手動起動を main に限る（push は on.push.branches で main に限定済み）。
    # スキップされると、needs で依存する deploy もスキップされる。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 起動した SHA（github.sha）ではなく、checkout の時点の main をビルドする。
      # 待機中に置き換えられた run や re-run が、古いコードを :latest にしないため。
      # build-push-action は context: . のときだけ checkout した作業ツリーをビルドする
      # （context を省くと Git context になり、github.sha をビルドする）。
      - name: Checkout main
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Set up Image Name
        id: meta
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # ★★★ ここを追加しました ★★★
      # これによりキャッシュ機能(type=gha)が使えるドライバーがセットアップされます
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_name }}:latest
          # これを使うには setup-buildx-action が必須でした
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record build summary
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
          BUILT_SHA: ${{ steps.checkout.outputs.commit }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Build and push'
            echo ''
            echo '| 項目 | 値 |'
            echo '|---|---|'
            echo "| 起動イベント | \`${TRIGGER_EVENT}\` |"
            echo "| 起動した SHA | \`${TRIGGER_SHA}\` |"
            echo "| ビルドした SHA（checkout で解決した main） | \`${BUILT_SHA}\` |"
            echo "| push したイメージ | \`${IMAGE_NAME}:latest\` |"
            echo "| digest | \`${IMAGE_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Restart K8s Pod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 最新の画像をプルして再起動
            export KUBECONFIG=~/.kube/config
            kubectl rollout restart deployment/chumon-hub
            # 追加: デプロイが完了するまで最大3分間（180秒）待機し、失敗したらエラーにする
            kubectl rollout status deployment/chumon-hub --timeout=180s
